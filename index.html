<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Martins</title>
  <meta name="description" content="Dale Martin — photography, videos, and code.">
  <style>
    :root {
      --bg: #f4efe6;
      --card: #fbf8f2;
      --ink: #3b2f25;
      --muted: #7a6a58;
      --line: #ddd2c0;
      --accent: #a0522d;
      --accent-2: #6b7445;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #241e19;
        --card: #2e2620;
        --ink: #ece3d6;
        --muted: #b3a491;
        --line: #463b31;
        --accent: #d08a5c;
        --accent-2: #a9b27c;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      line-height: 1.5;
    }
    main {
      flex: 1;
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: 2.5rem 1rem 2rem;
    }
    .banner {
      display: block;
      margin-bottom: 2rem;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
    }
    .banner img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 16 / 8;
      object-fit: cover;
      object-position: 50% 35%;
      filter: sepia(0.3);
    }
    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 7vw, 3rem);
      font-weight: normal;
      letter-spacing: 0.01em;
    }
    .rule {
      width: 3rem;
      height: 3px;
      margin: 1rem 0 1.25rem;
      background: linear-gradient(to right, var(--accent) 50%, var(--accent-2) 50%);
      border-radius: 2px;
    }
    .tagline { margin: 0 0 2.5rem; color: var(--muted); font-style: italic; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.75rem; }
    a.link {
      display: block;
      padding: 1rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 4px solid var(--accent-2);
      border-radius: 6px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.15s, transform 0.15s;
    }
    a.link:hover, a.link:focus-visible {
      border-left-color: var(--accent);
      transform: translateX(3px);
      outline: none;
    }
    .name { display: block; font-size: 1.15rem; color: var(--accent); }
    .desc {
      display: block;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      color: var(--muted);
    }
    footer {
      padding: 2rem 1rem;
      text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <a class="banner" href="https://dalemartin.photos">
      <img src="img/banjo-1280.jpg"
           srcset="img/banjo-640.jpg 640w, img/banjo-1280.jpg 1280w"
           sizes="(max-width: 40rem) 100vw, 40rem"
           width="1280" height="959"
           alt="Black-and-white concert photo: a banjo player on stage, arm raised in the stage haze">
    </a>
    <h1>The Martins</h1>
    <div class="rule"></div>
    <p class="tagline">Dale Martin on the web.</p>

    <ul>
      <li>
        <a class="link" href="https://dalemartin.photos">
          <span class="name">Photography</span>
          <span class="desc">dalemartin.photos</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://www.youtube.com/@dalemartin">
          <span class="name">YouTube</span>
          <span class="desc">youtube.com/@dalemartin</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://www.youtube.com/@DalesHomeVideos">
          <span class="name">Home Videos</span>
          <span class="desc">youtube.com/@DalesHomeVideos</span>
        </a>
      </li>
      <li>
        <a class="link" href="https://github.com/DaleEMartin">
          <span class="name">GitHub</span>
          <span class="desc">github.com/DaleEMartin</span>
        </a>
      </li>
    </ul>
  </main>

  <footer>&copy; Dale E. Martin</footer>
</body>
</html>
